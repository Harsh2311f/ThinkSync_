<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Tasks - Jharkhand Division | Indian Railways</title>
  
  <!-- SEO & Application Metadata -->
  <meta name="description" content="Unified view of TMS, SMMS & TDMS maintenance records with AI-powered prioritization. Indian Railways - Jharkhand Division.">
  
  <!-- Google Fonts: Plus Jakarta Sans for UI and JetBrains Mono for codes/numbers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Shared Application Stylesheet & Tasks Specific Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tasks.css">
  
  <!-- Global Theme & Sidebar Synchronizer -->
  <script src="theme-sync.js"></script>
</head>
<body>
  
  <!-- ========================================================================== -->
  <!-- MAIN APPLICATION LAYOUT WRAPPER                                            -->
  <!-- Splits screen into Left Sidebar and Right Main Content Area                -->
  <!-- ========================================================================== -->
  <div class="app-layout">
    
    <!-- ======================================================================== -->
    <!-- 1. LEFT SIDEBAR NAVIGATION                                               -->
    <!-- Contains Hamburger Show/Hide Toggle, Navigation Tabs, and Bottom Card    -->
    <!-- ======================================================================== -->
    <aside class="sidebar" id="sidebar">
      
      <!-- 1.1 Sidebar Header: Hamburger Show & Hide Toggle Button -->
      <div class="sidebar-header-toggle" id="sidebar-header-toggle">
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle Navigation Sidebar" title="Show / Hide Sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <span class="sidebar-toggle-label">Navigation</span>
      </div>

      <!-- 1.2 Navigation Menu Links -->
      <nav class="sidebar-nav" id="sidebar-nav-container" aria-label="Main navigation">
        <a href="index.html" class="nav-item" data-tab="dashboard" data-tooltip="Dashboard">
          <i class="fa-solid fa-house"></i>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="map.html" class="nav-item" data-tab="map" data-tooltip="Railway Health Map">
          <i class="fa-solid fa-location-dot"></i>
          <span class="nav-label">Railway Health Map</span>
        </a>
        <a href="calendar.html" class="nav-item" data-tab="calendar" data-tooltip="Block Calendar">
          <i class="fa-solid fa-calendar-days"></i>
          <span class="nav-label">Block Calendar</span>
        </a>
        <a href="tasks.html" class="nav-item active" data-tab="tasks" data-tooltip="Maintenance Tasks">
          <i class="fa-solid fa-clipboard-list"></i>
          <span class="nav-label">Maintenance Tasks</span>
        </a>
        <a href="movements.html" class="nav-item" data-tab="movements" data-tooltip="Train Movements">
          <i class="fa-solid fa-train"></i>
          <span class="nav-label">Train Movements</span>
        </a>
        <a href="resources.html" class="nav-item" data-tab="resources" data-tooltip="Resources">
          <i class="fa-solid fa-network-wired"></i>
          <span class="nav-label">Resources</span>
        </a>
        <a href="optimization.html" class="nav-item" data-tab="optimization" data-tooltip="Optimization">
          <i class="fa-solid fa-chart-line"></i>
          <span class="nav-label">Optimization</span>
        </a>
        <a href="reports.html" class="nav-item" data-tab="reports" data-tooltip="Reports">
          <i class="fa-solid fa-file-lines"></i>
          <span class="nav-label">Reports</span>
        </a>
        <a href="alerts.html" class="nav-item" data-tab="alerts" data-tooltip="Alerts">
          <i class="fa-solid fa-bell"></i>
          <span class="nav-label">Alerts</span>
        </a>
        <a href="settings.html" class="nav-item" data-tab="settings" data-tooltip="Settings">
          <i class="fa-solid fa-gear"></i>
          <span class="nav-label">Settings</span>
        </a>
      </nav>

      <!-- 1.3 Bottom Train Branding Card (Injected dynamically) -->
      <div class="sidebar-train-card" id="sidebar-train-card"></div>
      
    </aside>

    <!-- ======================================================================== -->
    <!-- 2. MAIN WORKSPACE WRAPPER (Top Header + Tasks Content + Footer)          -->
    <!-- ======================================================================== -->
    <div class="main-wrapper">
      
      <!-- ====================================================================== -->
      <!-- 2.1 TOP HEADER BAR                                                     -->
      <!-- ====================================================================== -->
      <header class="top-header">
        
        <!-- Header Left -->
        <div class="header-left"></div>

        <!-- Header Right: Search, Notifications, Profile -->
        <div class="header-right">
          
          <!-- Live Interactive Search Box -->
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="global-search" placeholder="Search section, station, train, task..." autocomplete="off">
            <div class="search-results-dropdown" id="search-dropdown"></div>
          </div>

          <!-- Notification Bell with Counter Badge -->
          <div class="notification-wrapper">
            <button class="icon-btn" id="notif-btn" aria-label="View System Notifications">
              <i class="fa-solid fa-bell"></i>
              <span class="notif-badge" id="header-notif-badge"></span>
            </button>
            
            <!-- Notification Dropdown Panel -->
            <div class="notif-dropdown" id="notif-dropdown">
              <div class="notif-header">
                <h3>System Notifications</h3>
                <span class="badge badge-danger" id="notif-dropdown-count"></span>
              </div>
              <div class="notif-list" id="notif-list-container"></div>
              <div class="notif-footer">
                <a href="#alerts" id="view-all-notifs">View All Alerts &rarr;</a>
              </div>
            </div>
          </div>

          <!-- User Profile Badge: Injected dynamically by tasks.js -->
          <div class="user-profile" id="user-profile-container"></div>
        </div>
      </header>

      <!-- ====================================================================== -->
      <!-- 2.2 TASKS CONTENT CANVAS (100% Data-Driven Architecture)               -->
      <!-- All containers populated via tasks.js; graceful fallback if empty      -->
      <!-- ====================================================================== -->
      <main class="tasks-page-main" id="tasks-page-main">
        
        <!-- ==================================================================== -->
        <!-- PART A: ACTION SUBHEADER TOOLBAR CARD                                -->
        <!-- Title, subtitle, "+ Create Task" and "Export" action buttons        -->
        <!-- Injected dynamically by renderTasksSubheader() in tasks.js           -->
        <!-- ==================================================================== -->
        <section class="dashboard-card tasks-subheader-card" id="tasks-subheader-card">
          <!-- Populated dynamically by tasks.js -->
        </section>

        <!-- ==================================================================== -->
        <!-- PART B: TOP 5 KPI SUMMARY METRIC CARDS ROW                           -->
        <!-- Total Tasks, Overdue Tasks, High Priority, In Progress, Completed    -->
        <!-- Injected dynamically by renderTasksKpis() in tasks.js                -->
        <!-- ==================================================================== -->
        <section class="tasks-kpi-grid" id="tasks-kpi-container">
          <!-- Populated dynamically by tasks.js -->
        </section>

        <!-- ==================================================================== -->
        <!-- PART C: FILTER TOOLBAR CARD                                          -->
        <!-- Section, Severity, Department, Overdue Status, Date Range, Buttons   -->
        <!-- Injected dynamically by renderFilterToolbar() in tasks.js            -->
        <!-- ==================================================================== -->
        <section class="dashboard-card tasks-filter-toolbar" id="tasks-filter-toolbar">
          <!-- Populated dynamically by tasks.js -->
        </section>

        <!-- ==================================================================== -->
        <!-- PART D: 2-COLUMN MAIN WORKSPACE LAYOUT                               -->
        <!-- Col 1: Charts (Priority, Dept, Status) + Task Table List             -->
        <!-- Col 2: Task Details Panel Card                                       -->
        <!-- ==================================================================== -->
        <div class="tasks-workspace-layout">
          
          <!-- LEFT COLUMN: Analytics Charts Row + Task List Table Card -->
          <div class="tasks-left-column">
            
            <!-- D.1 3-Column Analytics Charts Row -->
            <div class="tasks-analytics-grid">
              
              <!-- Chart 1: Tasks by Priority (Donut Chart) -->
              <div class="dashboard-card task-chart-card" id="chart-priority-card">
                <!-- Populated dynamically by renderPriorityChart() in tasks.js -->
              </div>

              <!-- Chart 2: Tasks by Department (SVG Bar Chart) -->
              <div class="dashboard-card task-chart-card" id="chart-dept-card">
                <!-- Populated dynamically by renderDeptChart() in tasks.js -->
              </div>

              <!-- Chart 3: Task Status (Donut Chart) -->
              <div class="dashboard-card task-chart-card" id="chart-status-card">
                <!-- Populated dynamically by renderStatusChart() in tasks.js -->
              </div>

            </div>

            <!-- D.2 Maintenance Task List Table Card (TMS + SMMS + TDMS) -->
            <div class="dashboard-card tasks-table-card" id="tasks-table-card">
              <!-- Populated dynamically by renderTasksTable() in tasks.js -->
            </div>

          </div>

          <!-- RIGHT COLUMN: Active Task Details Panel Card -->
          <div class="tasks-right-column">
            <div class="dashboard-card task-details-card" id="task-details-card">
              <!-- Populated dynamically by renderTaskDetails() in tasks.js -->
            </div>
          </div>

        </div>

      </main>

      <!-- ====================================================================== -->
      <!-- 2.3 BOTTOM FOOTER BANNER                                               -->
      <!-- Executive motto and Indian Railways brand partnership statement        -->
      <!-- Injected dynamically by renderSidebarAndFooter() in tasks.js           -->
      <!-- ====================================================================== -->
      <footer class="bottom-footer" id="app-bottom-footer">
        <div class="footer-quote" id="footer-quote-container"></div>
        <div class="footer-links" id="footer-links-container"></div>
      </footer>

    </div>

  </div>

  <!-- ========================================================================== -->
  <!-- MODAL: CREATE NEW MAINTENANCE TASK                                         -->
  <!-- Interactive popup dialog for scheduling a new task                         -->
  <!-- ========================================================================== -->
  <div class="modal-backdrop" id="create-task-modal" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="modal-icon"><i class="fa-solid fa-circle-plus"></i></span>
          <h3>Create New Maintenance Task</h3>
        </div>
        <button class="modal-close-btn" id="close-modal-btn" aria-label="Close dialog">&times;</button>
      </div>
      <form class="modal-form" id="create-task-form">
        <div class="form-row">
          <div class="form-group">
            <label for="task-source-input">Source System *</label>
            <select id="task-source-input" required>
              <option value="TMS">TMS (Track Management System)</option>
              <option value="SMMS">SMMS (Signal & Telecom Maintenance)</option>
              <option value="TDMS">TDMS (Traction & Rolling Stock)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-dept-input">Department *</label>
            <select id="task-dept-input" required>
              <option value="Track">Track (Engineering)</option>
              <option value="S&T">S&T (Signals & Telecom)</option>
              <option value="Mechanical">Mechanical (Loco & Rolling Stock)</option>
              <option value="Electrical">Electrical (TRD & OHE)</option>
              <option value="Civil">Civil (Bridges & Works)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-section-input">Railway Section *</label>
            <select id="task-section-input" required>
              <option value="Ranchi – Dhanbad">JH-RDH-001: Ranchi – Dhanbad</option>
              <option value="Bokaro – Chandrapura">JH-BOK-002: Bokaro – Chandrapura</option>
              <option value="Dhanbad – Koderma">JH-DKD-003: Dhanbad – Koderma</option>
              <option value="Hatia – Asansol">JH-HAS-004: Hatia – Asansol</option>
              <option value="Gumla – Lohardaga">JH-GML-005: Gumla – Lohardaga</option>
              <option value="Latehar – Garhwa">JH-LTG-006: Latehar – Garhwa</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-location-input">Location / Chainage *</label>
            <input type="text" id="task-location-input" placeholder="e.g. Km 312/4-5 or Hatia Yard" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-priority-input">Priority Level *</label>
            <select id="task-priority-input" required>
              <option value="High">High Priority</option>
              <option value="Medium" selected>Medium Priority</option>
              <option value="Low">Low Priority</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-due-input">Due Date *</label>
            <input type="date" id="task-due-input" value="2026-09-22" required>
          </div>
        </div>

        <div class="form-group">
          <label for="task-desc-input">Task Description *</label>
          <input type="text" id="task-desc-input" placeholder="e.g. Ultrasonic flaw testing, axle counter calibration..." required>
        </div>

        <div class="form-group">
          <label for="task-details-input">Detailed Scope & Requirements</label>
          <textarea id="task-details-input" rows="2" placeholder="Describe work order, traffic block requirement, gang assignment..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancel-task-btn">Cancel</button>
          <button type="submit" class="btn-submit"><i class="fa-solid fa-check"></i> Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Interactive Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Page Logic & Mock Data Script -->
  <script src="tasks.js"></script>
</body>
</html>
