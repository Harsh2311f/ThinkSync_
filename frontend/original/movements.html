<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Movements - Jharkhand Division | Indian Railways</title>
  
  <!-- SEO & Application Metadata -->
  <meta name="description" content="Live train movements, tracking, punctuality, and route timelines for Jharkhand Railway Network. Indian Railways.">
  
  <!-- Google Fonts: Plus Jakarta Sans for UI and JetBrains Mono for codes/numbers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Shared Application Stylesheet & Movements Specific Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="movements.css">
  
  <!-- Global Theme & Sidebar Synchronizer -->
  <script src="theme-sync.js"></script>
</head>
<body>
  
  <!-- ========================================================================== -->
  <!-- MAIN APPLICATION LAYOUT WRAPPER                                            -->
  <!-- Splits screen into Left Sidebar and Right Main Content Area                -->
  <!-- ========================================================================== -->
  <div class="app-layout">
    
    <!-- ======================================================================== -->
    <!-- 1. LEFT SIDEBAR NAVIGATION                                               -->
    <!-- Contains Hamburger Show/Hide Toggle, Navigation Tabs, and Bottom Card    -->
    <!-- ======================================================================== -->
    <aside class="sidebar" id="sidebar">
      
      <!-- 1.1 Sidebar Header: Hamburger Show & Hide Toggle Button -->
      <div class="sidebar-header-toggle" id="sidebar-header-toggle">
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle Navigation Sidebar" title="Show / Hide Sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <span class="sidebar-toggle-label">Navigation</span>
      </div>

      <!-- 1.2 Navigation Menu Links -->
      <nav class="sidebar-nav" id="sidebar-nav-container" aria-label="Main navigation">
        <a href="index.html" class="nav-item" data-tab="dashboard" data-tooltip="Dashboard">
          <i class="fa-solid fa-house"></i>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="map.html" class="nav-item" data-tab="map" data-tooltip="Railway Health Map">
          <i class="fa-solid fa-location-dot"></i>
          <span class="nav-label">Railway Health Map</span>
        </a>
        <a href="calendar.html" class="nav-item" data-tab="calendar" data-tooltip="Block Calendar">
          <i class="fa-solid fa-calendar-days"></i>
          <span class="nav-label">Block Calendar</span>
        </a>
        <a href="tasks.html" class="nav-item" data-tab="tasks" data-tooltip="Maintenance Tasks">
          <i class="fa-solid fa-clipboard-list"></i>
          <span class="nav-label">Maintenance Tasks</span>
        </a>
        <a href="movements.html" class="nav-item active" data-tab="movements" data-tooltip="Train Movements">
          <i class="fa-solid fa-train"></i>
          <span class="nav-label">Train Movements</span>
        </a>
        <a href="resources.html" class="nav-item" data-tab="resources" data-tooltip="Resources">
          <i class="fa-solid fa-network-wired"></i>
          <span class="nav-label">Resources</span>
        </a>
        <a href="optimization.html" class="nav-item" data-tab="optimization" data-tooltip="Optimization">
          <i class="fa-solid fa-chart-line"></i>
          <span class="nav-label">Optimization</span>
        </a>
        <a href="reports.html" class="nav-item" data-tab="reports" data-tooltip="Reports">
          <i class="fa-solid fa-file-lines"></i>
          <span class="nav-label">Reports</span>
        </a>
        <a href="alerts.html" class="nav-item" data-tab="alerts" data-tooltip="Alerts">
          <i class="fa-solid fa-bell"></i>
          <span class="nav-label">Alerts</span>
        </a>
        <a href="settings.html" class="nav-item" data-tab="settings" data-tooltip="Settings">
          <i class="fa-solid fa-gear"></i>
          <span class="nav-label">Settings</span>
        </a>
      </nav>

      <!-- 1.3 Bottom Train Branding Card (Injected dynamically) -->
      <div class="sidebar-train-card" id="sidebar-train-card"></div>
      
    </aside>

    <!-- ======================================================================== -->
    <!-- 2. MAIN WORKSPACE WRAPPER (Top Header + Movements Content + Footer)      -->
    <!-- ======================================================================== -->
    <div class="main-wrapper">
      
      <!-- ====================================================================== -->
      <!-- 2.1 TOP HEADER BAR                                                     -->
      <!-- ====================================================================== -->
      <header class="top-header">
        
        <!-- Header Left -->
        <div class="header-left"></div>

        <!-- Header Right: Search, Notifications, Profile -->
        <div class="header-right">
          
          <!-- Live Interactive Search Box -->
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="global-search" placeholder="Search section, station, train, task..." autocomplete="off">
            <div class="search-results-dropdown" id="search-dropdown"></div>
          </div>

          <!-- Notification Bell with Counter Badge -->
          <div class="notification-wrapper">
            <button class="icon-btn" id="notif-btn" aria-label="View System Notifications">
              <i class="fa-solid fa-bell"></i>
              <span class="notif-badge" id="header-notif-badge"></span>
            </button>
            
            <!-- Notification Dropdown Panel -->
            <div class="notif-dropdown" id="notif-dropdown">
              <div class="notif-header">
                <h3>System Notifications</h3>
                <span class="badge badge-danger" id="notif-dropdown-count"></span>
              </div>
              <div class="notif-list" id="notif-list-container"></div>
              <div class="notif-footer">
                <a href="#alerts" id="view-all-notifs">View All Alerts &rarr;</a>
              </div>
            </div>
          </div>

          <!-- User Profile Badge: Injected dynamically by movements.js -->
          <div class="user-profile" id="user-profile-container"></div>
        </div>
      </header>

      <!-- ====================================================================== -->
      <!-- 2.2 TRAIN MOVEMENTS CANVAS (100% Data-Driven Architecture)             -->
      <!-- All containers populated via movements.js; fallback if empty           -->
      <!-- ====================================================================== -->
      <main class="movements-page-main" id="movements-page-main">
        
        <!-- ==================================================================== -->
        <!-- PART A: TOP 6 KPI SUMMARY METRIC CARDS ROW                           -->
        <!-- Total Movements, Passenger, Freight, Avg Delay, Sections, Punctuality-->
        <!-- Injected dynamically by renderMovementsKpis() in movements.js        -->
        <!-- ==================================================================== -->
        <section class="movements-kpi-grid" id="movements-kpi-container">
          <!-- Populated dynamically by movements.js -->
        </section>

        <!-- ==================================================================== -->
        <!-- PART B: 2-COLUMN MAIN WORKSPACE GRID                                 -->
        <!-- Col 1: Live Train Movements Map (Coming Soon Telemetry Screen)       -->
        <!-- Col 2: Live & Upcoming Train Movements Interactive Table             -->
        <!-- ==================================================================== -->
        <div class="movements-main-grid">
          
          <!-- LEFT COLUMN: Live Train Movements – Jharkhand Railway Network Card -->
          <div class="dashboard-card movements-map-card" id="movements-map-card">
            
            <!-- Map Card Header with Title, Status & Live View Dropdown -->
            <div class="movements-card-header">
              <div class="movements-card-title-group">
                <h3 class="movements-card-title">Live Train Movements – Jharkhand Railway Network</h3>
              </div>
              <div class="movements-header-controls">
                <div class="live-view-dropdown-wrapper">
                  <span class="live-view-pulse"></span>
                  <select id="live-view-select" aria-label="Live View Selector">
                    <option value="live">Live View</option>
                    <option value="delayed">Delayed Only</option>
                    <option value="freight">Freight Corridors</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Map Status & Legend Ribbon -->
            <div class="movements-legend-bar" id="movements-legend-container">
              <!-- Populated dynamically by renderMovementsLegend() in movements.js -->
            </div>

            <!-- Map Viewport: Coming Soon Telemetry Radar Deployment View -->
            <!-- Per user instruction: "and you know waht show in map place" -->
            <div class="movements-map-viewport" id="movements-map-viewport">
              <!-- Populated dynamically by renderMovementsMap() in movements.js -->
            </div>

          </div>

          <!-- RIGHT COLUMN: Live & Upcoming Train Movements Table Card -->
          <div class="dashboard-card movements-table-card" id="movements-table-card">
            <!-- Populated dynamically by renderTrainTable() in movements.js -->
          </div>

        </div>

        <!-- ==================================================================== -->
        <!-- PART C: BOTTOM 3-COLUMN ANALYTICS GRID                               -->
        <!-- Col 1: Section Congestion (Live) with Progress Bars                  -->
        <!-- Col 2: Train Timeline (12810 Howrah-NDLS Exp) Milestone Tracker      -->
        <!-- Col 3: Train Details Card with Locomotive Specs and Live Speed       -->
        <!-- ==================================================================== -->
        <div class="movements-bottom-grid">
          
          <!-- Bottom Col 1: Section Congestion (Live) -->
          <div class="dashboard-card congestion-card" id="congestion-card">
            <!-- Populated dynamically by renderSectionCongestion() in movements.js -->
          </div>

          <!-- Bottom Col 2: Train Timeline Milestone Route Tracker -->
          <div class="dashboard-card timeline-card" id="timeline-card">
            <!-- Populated dynamically by renderTrainTimeline() in movements.js -->
          </div>

          <!-- Bottom Col 3: Train Details Card -->
          <div class="dashboard-card train-details-card" id="train-details-card">
            <!-- Populated dynamically by renderTrainDetails() in movements.js -->
          </div>

        </div>

      </main>

      <!-- ====================================================================== -->
      <!-- 2.3 APPLICATION FOOTER                                                 -->
      <!-- ====================================================================== -->
      <footer class="bottom-footer" id="app-bottom-footer">
        <div class="footer-quote" id="footer-quote-container"></div>
        <div class="footer-links" id="footer-links-container"></div>
      </footer>

    </div>
  </div>

  <!-- ========================================================================== -->
  <!-- MODAL: DYNAMIC TRAIN STOPPAGE (Created & Calculated via JavaScript)         -->
  <!-- ========================================================================== -->
  <div class="modal-backdrop" id="add-stoppage-modal" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="modal-icon"><i class="fa-solid fa-route"></i></span>
          <h3>Add Intermediate Stoppage</h3>
        </div>
        <button class="modal-close-btn" id="close-stoppage-modal-btn" aria-label="Close dialog">&times;</button>
      </div>
      <form class="modal-form" id="add-stoppage-form">
        <div class="form-row">
          <div class="form-group">
            <label for="stoppage-station-input">Station / Junction Name *</label>
            <input type="text" id="stoppage-station-input" placeholder="e.g. Barkakana, Koderma, Muri..." required>
          </div>
          <div class="form-group">
            <label for="stoppage-time-input">Scheduled Arrival Time *</label>
            <input type="text" id="stoppage-time-input" placeholder="e.g. 14:45" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="stoppage-status-select">Status along Route *</label>
            <select id="stoppage-status-select" required>
              <option value="upcoming" selected>Upcoming Station (Pending)</option>
              <option value="active">Active (Train Currently Arriving)</option>
              <option value="completed">Completed (Departed Station)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="stoppage-halt-input">Halt Duration *</label>
            <input type="text" id="stoppage-halt-input" placeholder="e.g. 2 min" value="2 min" required>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancel-stoppage-btn">Cancel</button>
          <button type="submit" class="btn-submit" id="submit-stoppage-btn">
            <i class="fa-solid fa-plus"></i> Add Stoppage to Timeline
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container for interactive user feedback -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- ========================================================================== -->
  <!-- SCRIPTS EXECUTION                                                          -->
  <!-- movements.js contains comments written first, master train store,           -->
  <!-- telemetry coming-soon renderer, interactive table filters & dynamic timeline-->
  <!-- ========================================================================== -->
  <script src="movements.js"></script>
</body>
</html>
